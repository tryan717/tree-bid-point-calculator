<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Calculator</title>

<style>
body { font-family: Arial; background:#f3f3f3; padding:10px; }
.card { background:white; padding:12px; margin-bottom:10px; border-radius:10px; }
select, input { width:100%; padding:10px; margin-top:5px; }
button { width:100%; padding:12px; margin-top:10px; }
.total { font-size:24px; text-align:center; margin:15px 0; font-weight:bold; }
</style>
</head>

<body>

<div class="card">
<h3>Customer Info</h3>
<input placeholder="Customer Name">
<input placeholder="Customer Email">
<input placeholder="Address">
</div>

<div class="total" id="total">$0</div>

<div id="trees"></div>

<button onclick="addTree()">+ Add Tree</button>

<div class="card">
<h3>Discounts</h3>

<label>Cash Discount ($)</label>
<select id="cash" onchange="calc()">
<option value="0">$0</option>
<option value="50">$50</option>
<option value="100">$100</option>
<option value="150">$150</option>
</select>

<label>Returning Customer Discount ($)</label>
<select id="returning" onchange="calc()">
<option value="0">$0</option>
<option value="50">$50</option>
<option value="100">$100</option>
<option value="150">$150</option>
</select>

<label>Manual Discount ($)</label>
<input type="number" id="manualDiscount" value="0" oninput="calc()">

</div>

<script>
let trees = [];

const sizeOptions = {
  3: "S",
  8: "M",
  14: "L",
  21: "XL"
};

const canopyOptions = {
  0: "S",
  1: "M",
  3: "L",
  5: "XL"
};

function addTree() {
  trees.push({ size:14, canopy:3 }); // L / L default
  render();
}

function render() {
  let html = "";

  trees.forEach((t,i)=>{
    html += `
    <div class="card">
      <b>Tree ${i+1}</b>

      <label>Size</label>
      <select onchange="update(${i},'size',this.value)">
        <option value="3" ${t.size==3?"selected":""}>S - 3 pts</option>
        <option value="8" ${t.size==8?"selected":""}>M - 8 pts</option>
        <option value="14" ${t.size==14?"selected":""}>L - 14 pts</option>
        <option value="21" ${t.size==21?"selected":""}>XL - 21 pts</option>
      </select>

      <label>Canopy</label>
      <select onchange="update(${i},'canopy',this.value)">
        <option value="0" ${t.canopy==0?"selected":""}>S - 0 pts</option>
        <option value="1" ${t.canopy==1?"selected":""}>M - 1 pt</option>
        <option value="3" ${t.canopy==3?"selected":""}>L - 3 pts</option>
        <option value="5" ${t.canopy==5?"selected":""}>XL - 5 pts</option>
      </select>
    </div>
    `;
  });

  document.getElementById("trees").innerHTML = html;
  calc();
}

function update(i,key,val){
  trees[i][key] = Number(val);
  calc();
}

function calc(){
  let total = 0;

  trees.forEach(t=>{
    total += (t.size + t.canopy) * 100;
  });

  const cash = Number(document.getElementById("cash").value || 0);
  const returning = Number(document.getElementById("returning").value || 0);
  const manual = Number(document.getElementById("manualDiscount").value || 0);

  total -= cash;
  total -= returning;
  total -= manual;

  if (total < 0) total = 0;

  document.getElementById("total").innerText = "$" + total;
}

addTree();
</script>

</body>
</html>
